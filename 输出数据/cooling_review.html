<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>冷静池节点筛选 - 火枭</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#f5f5f7;height:100vh;display:flex;overflow:hidden;--flash-color:#9f0304}
.stats-sidebar{width:170px;background:#fff;padding:24px 14px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.sidebar-title{font-size:16px;font-weight:600;color:#333;text-align:center;margin-bottom:8px}
.stat-box{padding:14px;border-radius:14px;text-align:center;transition:transform .2s}
.stat-box.total{background:#e3f2fd}.stat-box.pass{background:#e8f5e9}.stat-box.block{background:#ffebee}.stat-box.skip{background:#f0f0f0;opacity:.7}.stat-box.pending{background:#fff3e0}
.stat-num{font-size:26px;font-weight:bold}
.stat-box.total .stat-num{color:#1565c0}.stat-box.pass .stat-num{color:#2e7d32}.stat-box.block .stat-num{color:#c62828}.stat-box.skip .stat-num{color:#888}.stat-box.pending .stat-num{color:#e65100}
.stat-label{font-size:12px;color:#666;margin-top:2px}
.stat-box.bump{transform:scale(1.08)}
.submit-btn{width:100%;padding:22px;background:#2e7d32;color:#fff;border:none;border-radius:16px;font-size:18px;font-weight:bold;cursor:pointer}
.submit-btn:hover{background:#1b5e20}
.reset-btn{width:100%;padding:22px;background:#eceff1;color:#546e7a;border:none;border-radius:16px;font-size:18px;font-weight:bold;cursor:pointer}
.reset-btn:hover{background:#cfd8dc}
.sidebar-footer{margin-top:auto;display:flex;flex-direction:column;gap:26px}
.color-input-wrap{display:flex;align-items:center;gap:8px}
.color-preview{width:42px;height:42px;border-radius:12px;background:var(--flash-color);border:2px solid #fff;box-shadow:0 0 0 1px #ddd;flex-shrink:0}
.color-input{flex:1;min-width:0;padding:12px;border:1px solid #cfd8dc;border-radius:12px;font-size:13px;font-family:monospace;outline:none}
.color-input:focus{border-color:var(--flash-color)}
.vid-page-box{position:fixed;top:0;left:0;width:56px;background:#fff;border-radius:10px;border-bottom:8px solid #2e7d32;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
.vid-page-num{font-size:34px;font-weight:bold;color:var(--flash-color);line-height:1}
.vid-page-total{font-size:13px;color:#aaa;margin-top:4px}
.vid-page-box.vidflash{animation:vidFlash .35s ease}
@keyframes vidFlash{0%{background:var(--flash-color);color:#fff}100%{background:#fff;color:var(--flash-color)}}
.card-area{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 6px 20px 20px}
.node-card{width:100%;max-width:900px;background:#fff;border-radius:24px;padding:24px;display:flex;gap:24px;align-items:stretch;height:calc(100vh - 40px)}
.fade{animation:fadeIn 1s ease}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
.grid-9{flex:1.6;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;height:100%}
.video-thumb{height:100%;background:#eee;border-radius:8px;position:relative;overflow:hidden;cursor:pointer}
.video-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.like-badge{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:10px;font-size:11px}
.side-panel{flex:1;display:flex;flex-direction:column;padding-left:24px;border-left:1px solid #f0f0f0}
.user-info{text-align:center;padding:16px 0}
.avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);margin:0 auto 10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold}
.user-info h2{font-size:18px;color:#1a1a1a;margin-bottom:4px}
.user-info p{font-size:13px;color:#999}
.btn-group{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:14px;padding:8px 0}
.btn{padding:34px 16px;border:6px solid transparent;border-radius:20px;font-size:16px;font-weight:600;cursor:pointer;transition:all .6s ease}
.btn-pass{background:#e8f5e9;color:#2e7d32}.btn-block{background:#ffebee;color:#c62828}.btn-skip{background:#f0f0f0;color:#999;opacity:.75}
.btn.selected-pass{border-color:#2e7d32;background:#a5d6a7;opacity:1}
.btn.selected-block{border-color:#c62828;background:#ef9a9a;opacity:1}
.btn.selected-skip{border-color:#757575;background:#bdbdbd;color:#424242;opacity:1}
.nav-area{width:130px;display:flex;flex-direction:column;align-items:flex-start;padding-top:44px;flex-shrink:0}
.page-box{width:130px;height:130px;background:#fff;border-radius:8px;border-bottom:8px solid #2e7d32;display:flex;flex-direction:column;align-items:center;justify-content:center}
.page-num-big{font-size:60px;font-weight:bold;color:var(--flash-color);line-height:1}
.page-total{font-size:15px;color:#aaa;margin-top:6px}
.nav-arrows{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100}
.nav-btn{width:64px;height:64px;border:none;background:#fff;border-radius:50%;font-size:26px;cursor:pointer;color:#555}
.nav-btn:hover{background:#ececec;color:#333}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.flash-red{animation:btnFlash .35s ease}
@keyframes btnFlash{0%{background:var(--flash-color);color:#fff}100%{background:#fff;color:#555}}
.page-subnum{font-size:13px;color:#aaa}
</style>
</head>

let nodes=[], idx=0, decisions=[];
let lastDirection=1;
function fmtNum(n){
  n=Number(n)||0;
  if(n>=10000){return (n/10000).toFixed(1).replace(/\.0$/,'')+'w';}
  if(n>=1000){return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';}
  return String(n);
}

function sizeVidBox(){
  const box=document.getElementById('vid-page-box');
  const stats=document.querySelector('.stats-sidebar');
  const card=document.getElementById('node-card');
  if(!box||!stats||!card)return;
  const sr=stats.getBoundingClientRect(),cr=card.getBoundingClientRect();
  const w=Math.max(40,cr.left-sr.right-36);
  box.style.left=(sr.right+18)+'px';
  box.style.width=w+'px';
  box.style.height=w+'px';
  box.style.top=Math.max(10,(window.innerHeight-w)/2)+'px';
}
function loadData(){
  nodes = EMBEDDED;
  decisions = new Array(nodes.length).fill(null);
  document.getElementById('total').innerText = nodes.length;
  document.getElementById('pending').innerText = nodes.length;
  render();
}
let vidx=0;                 // 当前节点内视频页（每页9条）
function videoPages(n){return Math.max(1,Math.ceil((n.likes||[]).length/9));}
function videoPrev(){if(vidx<=0)return;vidx--;render();flashVidBox()}
function videoNext(){if(vidx>=videoPages(nodes[idx])-1)return;vidx++;render();flashVidBox()}

function bumpStat(w){const el=document.getElementById('box-'+w);el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),200)}
function countStats(changed){
  const p=decisions.filter(x=>x==='pass').length,b=decisions.filter(x=>x==='block').length,s=decisions.filter(x=>x==='skip').length;
  document.getElementById('passed').innerText=p;document.getElementById('blocked').innerText=b;document.getElementById('skipped').innerText=s;
  document.getElementById('pending').innerText=nodes.length-p-b-s;
  if(changed)bumpStat(changed==='pass'?'pass':changed==='block'?'block':'skip');
}

function render(){
  if(!nodes.length) return;
  const card=document.getElementById('node-card');
  card.classList.remove('fade');void card.offsetWidth;card.classList.add('fade');
  const n=nodes[idx];
  document.getElementById('nickname').innerText=n.nickname;
document.getElementById('nickname').onclick=()=>window.open(`https://www.douyin.com/user/${n.sec_uid}`,'_blank');
  const av=document.getElementById('avatar');
av.style.cursor='pointer';av.title='点击进入抖音官方主页';
av.onclick=()=>window.open(`https://www.douyin.com/user/${n.sec_uid}`,'_blank');
if(n.profile && n.profile.avatar){av.style.background='none';av.style.padding='0';av.innerHTML=`<img src="${n.profile.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.onerror=null;this.style.display='none';av.style.background='linear-gradient(135deg,#667eea,#764ba2)';av.innerHTML=((n.nickname||'?').trim()[0]||'?')">`;}
else{av.style.background='linear-gradient(135deg,#667eea,#764ba2)';av.style.padding='0';av.innerHTML=(n.nickname||'?').trim()[0]||'?';}
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const totalPages=videoPages(n);
  if(vidx>=totalPages)vidx=totalPages-1;
  const base=vidx*9;
  for(let i=0;i<9;i++){
    const v=(n.likes||[])[base+i];
    const cell=document.createElement('div');
    cell.className='video-thumb';
    if(v && v.cover){
      cell.innerHTML=`<img src="${v.cover}" loading="lazy" onerror="this.style.display='none'"><span class="like-badge">❤ ${fmtNum(v.digg||0)}</span>`;
      cell.onclick=()=>window.open(`https://www.douyin.com/video/${v.aweme_id}`,'_blank');
    }else{
      cell.innerHTML='<span class="like-badge">❤ 0</span>';
    }
    grid.appendChild(cell);
  }
  const um=document.getElementById('user-meta');
if(n.profile){um.innerText=`获赞 ${fmtNum(n.profile.total_favorited||0)} · 粉丝 ${fmtNum(n.profile.follower_count||0)} · 关注 ${fmtNum(n.profile.following_count||0)} · 喜欢 ${fmtNum(n.profile.favoriting_count||0)} · ${(n.profile.region||'')}`;}
const _vp=videoPages(n);document.getElementById('vid-page-num').innerText=vidx+1;document.getElementById('vid-page-total').innerText='/ '+_vp;document.getElementById('page-num').innerText=idx+1;
  document.getElementById('page-total').innerText='/ '+nodes.length;
  document.getElementById('page-subnum').innerText=(idx+1)+' / '+nodes.length;
  document.getElementById('prev-btn').disabled=idx===0;sizeVidBox();
  document.getElementById('next-btn').disabled=idx===nodes.length-1;
  const d=decisions[idx];
  document.getElementById('btn-pass').classList.toggle('selected-pass',d==='pass');
  document.getElementById('btn-block').classList.toggle('selected-block',d==='block');
  document.getElementById('btn-skip').classList.toggle('selected-skip',d==='skip');
}
function leaveCurrent(){if(decisions[idx]===null){decisions[idx]='skip';countStats('skip')}}
function flashArrow(dir){const b=document.getElementById(dir>0?'next-btn':'prev-btn');b.classList.remove('flash-red');void b.offsetWidth;b.classList.add('flash-red');setTimeout(()=>b.classList.remove('flash-red'),360)}
function flashVidBox(){const b=document.getElementById('vid-page-box');b.classList.remove('vidflash');void b.offsetWidth;b.classList.add('vidflash');setTimeout(()=>b.classList.remove('vidflash'),360)}
function goTo(n){if(n===idx||n<0||n>=nodes.length)return;const dir=n>idx?1:-1;lastDirection=dir;leaveCurrent();idx=n;vidx=0;render();flashArrow(dir)}
function prevPage(){goTo(idx-1)}
function nextPage(){goTo(idx+1)}
function decide(a){const prev=decisions[idx];decisions[idx]=a;countStats(prev===a?null:a);
document.getElementById('btn-pass').classList.toggle('selected-pass',a==='pass');
document.getElementById('btn-block').classList.toggle('selected-block',a==='block');
document.getElementById('btn-skip').classList.toggle('selected-skip',a==='skip');
setTimeout(()=>goTo(idx+1),177)}
async function submitAll(){
  leaveCurrent();countStats();
  const result=nodes.map((n,i)=>({sec_uid:n.sec_uid, decision:decisions[i]}));
  const p=result.filter(x=>x.decision==='pass').length,b=result.filter(x=>x.decision==='block').length,s=result.filter(x=>x.decision==='skip').length;
  try{
    const r=await fetch('http://192.168.0.105:8100/v1/review/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Api-Key':'huoxiao-2026'},
      body:JSON.stringify({results:result})
    });
    const j=await r.json();
    if(j.code===0){
      alert(`✅ 已写回数据库！\n通过进生产池：${j.data.pass}\n永久拉黑：${j.data.block}\n忽略跳过：${j.data.skip}`);
    }else{
      alert('提交失败: '+JSON.stringify(j.meta));
    }
  }catch(e){
    alert('无法连接火枭服务(192.168.0.105:8100)：'+e.message);
  }
}
function resetAll(){if(!confirm('确定清空所有筛选、从第一张重新开始吗？'))return;decisions.fill(null);idx=0;countStats();render()}
document.getElementById('prev-btn').onclick=prevPage;
document.getElementById('next-btn').onclick=nextPage;
document.addEventListener('keydown',e=>{
  if(e.target.classList.contains('color-input'))return;
  if(e.key==='ArrowUp'){e.preventDefault();prevPage()}
  if(e.key==='ArrowDown'){e.preventDefault();nextPage()}
  if(e.key==='ArrowLeft'){e.preventDefault();decide('pass')}
  if(e.key==='ArrowRight'){e.preventDefault();decide('block')}
  if(e.key==='a'||e.key==='A'){e.preventDefault();videoPrev()}
  if(e.key==='f'||e.key==='F'){e.preventDefault();videoNext()}
});
const DEFAULT_COLOR='#9f0304';
const savedColor=localStorage.getItem('huoxiao_flash_color')||DEFAULT_COLOR;
const colorInput=document.getElementById('color-input');colorInput.value=savedColor;
function applyColor(v){v=v.trim();if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){document.body.style.setProperty('--flash-color',v);document.getElementById('color-preview').style.background=v;localStorage.setItem('huoxiao_flash_color',v)}}
colorInput.addEventListener('input',e=>applyColor(e.target.value));
colorInput.addEventListener('change',e=>{if(!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(e.target.value))e.target.value=savedColor;applyColor(e.target.value)});
applyColor(savedColor);
let wheelLock=false;
document.getElementById('card-area').addEventListener('wheel',e=>{
  e.preventDefault();if(wheelLock)return;wheelLock=true;
  if(e.deltaY>0)nextPage();else prevPage();
  setTimeout(()=>wheelLock=false,500);
},{passive:false});
window.addEventListener('resize',sizeVidBox);
loadData();
</script>
