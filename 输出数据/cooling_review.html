*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#f5f5f7;height:100vh;display:flex;overflow:hidden;--flash-color:#9f0304}

function fmtNum(n){
  n=Number(n)||0;
  if(n>=10000){return (n/10000).toFixed(1).replace(/\.0$/,'')+'w';}
  if(n>=1000){return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';}
  return String(n);
}

function loadData(){
  nodes = EMBEDDED;
  decisions = new Array(nodes.length).fill(null);
  document.getElementById('total').innerText = nodes.length;
  document.getElementById('pending').innerText = nodes.length;
  render();
}

function videoPrev(){if(vidx<=0)return;vidx--;render();flashArrow(-1)}
function videoNext(){if(vidx>=videoPages(nodes[idx])-1)return;vidx++;render();flashArrow(1)}

function bumpStat(w){const el=document.getElementById('box-'+w);el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),200)}
function countStats(changed){
  const p=decisions.filter(x=>x==='pass').length,b=decisions.filter(x=>x==='block').length,s=decisions.filter(x=>x==='skip').length;
  document.getElementById('passed').innerText=p;document.getElementById('blocked').innerText=b;document.getElementById('skipped').innerText=s;
  document.getElementById('pending').innerText=nodes.length-p-b-s;
  if(changed)bumpStat(changed==='pass'?'pass':changed==='block'?'block':'skip');
}

function render(){
  if(!nodes.length) return;
  const card=document.getElementById('node-card');
  card.classList.remove('fade');void card.offsetWidth;card.classList.add('fade');
  const n=nodes[idx];
  document.getElementById('nickname').innerText=n.nickname;
document.getElementById('nickname').onclick=()=>window.open(`https://www.douyin.com/user/${n.sec_uid}`,'_blank');
  const av=document.getElementById('avatar');
av.style.cursor='pointer';av.title='点击进入抖音官方主页';
av.onclick=()=>window.open(`https://www.douyin.com/user/${n.sec_uid}`,'_blank');
if(n.profile && n.profile.avatar){av.style.background='none';av.style.padding='0';av.innerHTML=`<img src="${n.profile.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;}
else{av.style.background='linear-gradient(135deg,#667eea,#764ba2)';av.style.padding='0';av.innerHTML=(n.nickname||'?').trim()[0]||'?';}
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const totalPages=videoPages(n);
  if(vidx>=totalPages)vidx=totalPages-1;
  const base=vidx*9;
  for(let i=0;i<9;i++){
    const v=(n.likes||[])[base+i];
    const cell=document.createElement('div');
    cell.className='video-thumb';
    if(v && v.cover){
      cell.innerHTML=`<img src="${v.cover}" loading="lazy" onerror="this.style.display='none'"><span class="like-badge">❤ ${fmtNum(v.digg||0)}</span>`;
      cell.onclick=()=>window.open(`https://www.douyin.com/video/${v.aweme_id}`,'_blank');
    }else{
      cell.innerHTML='<span class="like-badge">❤ 0</span>';
    }
    grid.appendChild(cell);
  }
  const um=document.getElementById('user-meta');
if(n.profile){um.innerText=`获赞 ${fmtNum(n.profile.total_favorited||0)} · 粉丝 ${fmtNum(n.profile.follower_count||0)} · 关注 ${fmtNum(n.profile.following_count||0)} · 喜欢 ${fmtNum(n.profile.favoriting_count||0)} · ${(n.profile.region||'')}`;}
document.getElementById('page-num').innerText=idx+1;
  document.getElementById('page-total').innerText='/ '+nodes.length;
  document.getElementById('page-subnum').innerText=(idx+1)+' / '+nodes.length;
  document.getElementById('prev-btn').disabled=idx===0;
  document.getElementById('next-btn').disabled=idx===nodes.length-1;
  const d=decisions[idx];
  document.getElementById('btn-pass').classList.toggle('selected-pass',d==='pass');
  document.getElementById('btn-block').classList.toggle('selected-block',d==='block');
  document.getElementById('btn-skip').classList.toggle('selected-skip',d==='skip');
}
function leaveCurrent(){if(decisions[idx]===null){decisions[idx]='skip';countStats('skip')}}
function flashArrow(dir){const b=document.getElementById(dir>0?'next-btn':'prev-btn');b.classList.remove('flash-red');void b.offsetWidth;b.classList.add('flash-red');setTimeout(()=>b.classList.remove('flash-red'),360)}
function goTo(n){if(n===idx||n<0||n>=nodes.length)return;const dir=n>idx?1:-1;lastDirection=dir;leaveCurrent();idx=n;vidx=0;render();flashArrow(dir)}
function prevPage(){goTo(idx-1)}
function nextPage(){goTo(idx+1)}
function decide(a){const prev=decisions[idx];decisions[idx]=a;countStats(prev===a?null:a);
document.getElementById('btn-pass').classList.toggle('selected-pass',a==='pass');
document.getElementById('btn-block').classList.toggle('selected-block',a==='block');
document.getElementById('btn-skip').classList.toggle('selected-skip',a==='skip');
setTimeout(()=>goTo(idx+1),177)}
async function submitAll(){
  leaveCurrent();countStats();
  const result=nodes.map((n,i)=>({sec_uid:n.sec_uid, decision:decisions[i]}));
  const p=result.filter(x=>x.decision==='pass').length,b=result.filter(x=>x.decision==='block').length,s=result.filter(x=>x.decision==='skip').length;
  try{
    const r=await fetch('http://192.168.0.105:8100/v1/review/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Api-Key':'huoxiao-2026'},
      body:JSON.stringify({results:result})
    });
    const j=await r.json();
    if(j.code===0){
      alert(`✅ 已写回数据库！\n通过进生产池：${j.data.pass}\n永久拉黑：${j.data.block}\n忽略跳过：${j.data.skip}`);
    }else{
      alert('提交失败: '+JSON.stringify(j.meta));
    }
  }catch(e){
    alert('无法连接火枭服务(192.168.0.105:8100)：'+e.message);
  }
}
function resetAll(){if(!confirm('确定清空所有筛选、从第一张重新开始吗？'))return;decisions.fill(null);idx=0;countStats();render()}
document.getElementById('prev-btn').onclick=prevPage;
document.getElementById('next-btn').onclick=nextPage;
document.addEventListener('keydown',e=>{
  if(e.target.classList.contains('color-input'))return;
  if(e.key==='ArrowUp'){e.preventDefault();prevPage()}
  if(e.key==='ArrowDown'){e.preventDefault();nextPage()}
  if(e.key==='ArrowLeft'){e.preventDefault();decide('pass')}
  if(e.key==='ArrowRight'){e.preventDefault();decide('block')}
  if(e.key==='a'||e.key==='A'){e.preventDefault();videoPrev()}
  if(e.key==='f'||e.key==='F'){e.preventDefault();videoNext()}
});
const DEFAULT_COLOR='#9f0304';
const savedColor=localStorage.getItem('huoxiao_flash_color')||DEFAULT_COLOR;
const colorInput=document.getElementById('color-input');colorInput.value=savedColor;
function applyColor(v){v=v.trim();if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){document.body.style.setProperty('--flash-color',v);document.getElementById('color-preview').style.background=v;localStorage.setItem('huoxiao_flash_color',v)}}
colorInput.addEventListener('input',e=>applyColor(e.target.value));
colorInput.addEventListener('change',e=>{if(!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(e.target.value))e.target.value=savedColor;applyColor(e.target.value)});
applyColor(savedColor);
let wheelLock=false;
document.getElementById('card-area').addEventListener('wheel',e=>{
  e.preventDefault();if(wheelLock)return;wheelLock=true;
  if(e.deltaY>0)nextPage();else prevPage();
  setTimeout(()=>wheelLock=false,500);
},{passive:false});
loadData();
</script>
</body>
</html>
